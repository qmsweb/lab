<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>نص إلى PDF عربي</title>

<!-- مكتبة PDFMake مع دعم العربية -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>

</head>
<body>

<h3>أدخل النص:</h3>
<textarea id="txt" rows="10" cols="80"></textarea><br><br>
<button onclick="makePDF()">إنشاء PDF</button>

<script>
function makePDF(){
    let text = document.getElementById("txt").value;
    if(!text.trim()){ alert("أدخل نصاً"); return;}

    // تقسيم الأسطر تلقائيًا ليتعامل مع الطول
    let paragraphs = text.split("\n").map(l => ({ text:l, margin:[0,4,0,0] }));

    let doc = {
        pageSize: 'A4',
        defaultStyle:{ font:'Helvetica', fontSize:12 },
        content: paragraphs
    };

    pdfMake.createPdf(doc).download("file.pdf");
}
</script>

</body>
</html>
