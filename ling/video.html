<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاهدة الفيديو | ركن اللسانيات</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.png" type="image/jpg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary-color: #1a2ac6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Noto Kufi Arabic", sans-serif;
    }

    body {
      background-color: #f4f6fb;
      color: #2d2d2d;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ======= التوب بار (نفس السابق تماماً) ======= */
    .topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 70px;
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      padding: 0 25px;
      z-index: 1000;
    }

    .topbar-logo img {
      height: 45px;
      border-radius: 8px;
    }

    /* ======= مشغل الفيديو ======= */
    .player-container {
      max-width: 1000px;
      margin: 100px auto 40px auto; /* مسافة من الأعلى للتوب بار */
      padding: 0 20px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* نسبة 16:9 */
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }

    .video-wrapper iframe, 
    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .video-info h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .video-info p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
    }

    /* ======= قائمة الأفلام (اقتراحات) ======= */
    .movies-section {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #333;
      border-right: 4px solid var(--primary-color);
      padding-right: 10px;
    }

    .movies-list {
      display: flex;
      flex-direction: row;
      gap: 18px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 10px;
    }

    .movie-item {
      flex: 0 0 auto;
      width: 300px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      cursor: pointer;
      /* تم إزالة أي تأثيرات حركة (Transform/Transition) */
    }

    /* إزالة تأثير الحركة عند التحويم */
    .movie-item:hover {
      opacity: 0.9; /* تغيير بسيط في الشفافية فقط للدلالة على التفاعل دون حركة */
      transform: none; 
    }

    .movie-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.75);
    }

    .movie-logo {
      position: absolute;
      bottom: 10px;
      right: 50%;
      transform: translateX(50%);
      width: 40%;
      border-radius: 6px;
    }

    /* رسالة خطأ أو تحميل */
    .status-msg {
      text-align: center;
      padding: 50px;
      font-size: 1.2rem;
      color: #777;
    }

    @media (max-width: 768px) {
      .player-container { margin-top: 90px; }
      .video-info h1 { font-size: 1.2rem; }
      .movies-list { gap: 12px; }
      .movie-item { width: 220px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="https://raw.githubusercontent.com/qmsweb/lab/main/ling/images/logo-ling.png" alt="شعار">
    </div>
  </div>

  <div class="player-container">
    <div class="video-wrapper" id="video-wrapper">
      <div class="status-msg" id="loading-msg">جاري تحميل الفيديو...</div>
    </div>
    
    <div class="video-info">
      <h1 id="video-title"></h1>
      <p id="video-desc"></p>
    </div>
  </div>

  <section class="movies-section">
    <h3 class="section-title">فيديوهات قد تعجبك</h3>
    <div class="movies-list" id="movies-list"></div>
  </section>

  <script>
    // العناصر
    const videoWrapper = document.getElementById('video-wrapper');
    const videoTitle = document.getElementById('video-title');
    const videoDesc = document.getElementById('video-desc');
    const moviesList = document.getElementById('movies-list');
    const loadingMsg = document.getElementById('loading-msg');

    // الحصول على المعرف من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    if (videoId) {
      loadVideoData(videoId);
    } else {
      loadingMsg.textContent = "لم يتم تحديد فيديو للعرض.";
    }

    // دالة جلب بيانات الفيديو الرئيسي (الآلية المطلوبة)
    function loadVideoData(id) {
      // استخدام الآلية المطلوبة: /videp?i=id
      fetch(`/videp?i=${id}`)
        .then(response => {
          if (!response.ok) throw new Error("Network response was not ok");
          return response.json();
        })
        .then(data => {
            // تحديث الواجهة بالبيانات
            loadingMsg.style.display = 'none';
            videoTitle.textContent = data.title || "عنوان الفيديو";
            videoDesc.textContent = data.desc || data.description || "لا يوجد وصف متاح.";
            
            // إنشاء عنصر الفيديو (YouTube أو مباشر حسب الرابط)
            // ملاحظة: نفترض أن البيانات العائدة تحتوي على حقل link أو url
            const videoSrc = data.link || data.url || "";
            
            if (videoSrc.includes('youtube') || videoSrc.includes('youtu.be')) {
                // معالجة روابط يوتيوب لتضمينها
                const embedUrl = videoSrc.replace("watch?v=", "embed/");
                videoWrapper.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
            } else {
                // فيديو عادي
                videoWrapper.innerHTML = `
                  <video controls autoplay>
                    <source src="${videoSrc}" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                  </video>
                `;
            }
        })
        .catch(err => {
          console.error("خطأ في جلب بيانات الفيديو:", err);
          loadingMsg.textContent = "عذراً، حدث خطأ أثناء تحميل الفيديو أو أن الرابط غير متوفر.";
          
          // --- (كود احتياطي للعرض فقط في حال عدم وجود السيرفر الفعلي) ---
          // هذا الجزء يمكنك حذفه إذا كان السيرفر /videp يعمل بالفعل
          // نحاول البحث في ملف movies.json كبديل للعرض التجريبي
           fetch("/ling/data/movies.json")
             .then(r => r.json())
             .then(list => {
                const fallbackMovie = list.find(m => (m.id == id || m.title == id));
                if(fallbackMovie) {
                   loadingMsg.style.display = 'none';
                   videoTitle.textContent = fallbackMovie.title;
                   videoDesc.textContent = fallbackMovie.desc || "مشاهدة ممتعة";
                   videoWrapper.innerHTML = `<iframe src="${fallbackMovie.link}" allowfullscreen></iframe>`;
                }
             });
          // -------------------------------------------------------------
        });
    }

    // تحميل القائمة السفلية (من الملف الثابت كما في الصفحة السابقة)
    fetch("/ling/data/movies.json")
      .then(res => res.json())
      .then(movies => {
        movies.forEach(movie => {
          // استثناء الفيديو المعروض حالياً من القائمة (اختياري)
          if (movie.id == videoId) return;

          const item = document.createElement("div");
          item.className = "movie-item";
          // استخدام نفس هيكلية البطاقة القديمة
          item.innerHTML = `
            <img class="movie-bg" src="${movie.bg}" alt="${movie.title}">
            <img class="movie-logo" src="${movie.logo}" alt="${movie.title}">
          `;
          
          // عند النقر يتم الانتقال للصفحة مع تمرير الآيدي
          item.addEventListener("click", () => {
            window.location.href = `?id=${encodeURIComponent(movie.id || movie.title)}`;
          });
          
          moviesList.appendChild(item);
        });
      })
      .catch(err => console.error("فشل تحميل القائمة:", err));

  </script>
</body>
</html>
