<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مشاهدة الفيديو | ركن اللسانيات</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400..800&display=swap" rel="stylesheet">
  <link rel="icon" href="images/favicon.png" type="image/jpg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary-color: #1a2ac6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Noto Kufi Arabic", sans-serif;
    }

    body {
      background-color: #f4f6fb;
      color: #2d2d2d;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ======= التوب بار ======= */
    .topbar {
      position: fixed;
      top: 0;
      right: 0;
      left: 0;
      height: 70px;
      background-color: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      padding: 0 25px;
      z-index: 1000;
    }

    .topbar-logo img {
      height: 45px;
      border-radius: 8px;
    }

    /* ======= مشغل الفيديو ======= */
    .player-container {
      max-width: 1000px;
      margin: 100px auto 40px auto;
      padding: 0 20px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px; /* ارتفاع مبدئي حتى يتم التحميل */
    }

    video {
      width: 100%;
      max-height: 80vh;
      outline: none;
    }

    .video-info h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .video-info p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555;
    }

    /* ======= قائمة الأفلام ======= */
    .movies-section {
      max-width: 1200px;
      margin: 50px auto;
      padding: 0 20px;
    }

    .section-title {
      font-size: 1.2rem;
      margin-bottom: 20px;
      color: #333;
      border-right: 4px solid var(--primary-color);
      padding-right: 10px;
    }

    .movies-list {
      display: flex;
      flex-direction: row;
      gap: 18px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 10px;
    }

    .movie-item {
      flex: 0 0 auto;
      width: 300px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      cursor: pointer;
      /* بدون حركة Transform */
    }

    .movie-item:hover {
        opacity: 0.95; /* تأثير بسيط جداً */
    }

    .movie-bg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.75);
    }

    .movie-logo {
      position: absolute;
      bottom: 10px;
      right: 50%;
      transform: translateX(50%);
      width: 40%;
      border-radius: 6px;
    }

    .status-msg {
      color: #fff;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .player-container { margin-top: 90px; }
      .video-wrapper { min-height: 250px; }
      .video-info h1 { font-size: 1.2rem; }
      .movies-list { gap: 12px; }
      .movie-item { width: 220px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <img src="https://raw.githubusercontent.com/qmsweb/lab/main/ling/images/logo-ling.png" alt="شعار">
    </div>
  </div>

  <div class="player-container">
    <div class="video-wrapper" id="video-wrapper">
      <div class="status-msg" id="loading-msg">
        <i class="fas fa-spinner fa-spin"></i> جاري تحميل الفيديو...
      </div>
    </div>
    
    <div class="video-info">
      <h1 id="video-title"></h1>
      <p id="video-desc"></p>
    </div>
  </div>

  <section class="movies-section">
    <h3 class="section-title">فيديوهات قد تعجبك</h3>
    <div class="movies-list" id="movies-list"></div>
  </section>

  <script>
    // العناصر
    const videoWrapper = document.getElementById('video-wrapper');
    const videoTitle = document.getElementById('video-title');
    const videoDesc = document.getElementById('video-desc');
    const moviesList = document.getElementById('movies-list');
    const loadingMsg = document.getElementById('loading-msg');

    // 1. استخراج الـ ID من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    // 2. تحديد مسار قاعدة البيانات (JSON)
    // ملاحظة لبيئة GitHub Pages: نستخدم مساراً نسبياً (بدون / في البداية)
    // ليعمل سواء كان الموقع في Root أو في مجلد فرعي
    const DATABASE_URL = "ling/data/movies.json"; 

    // دالة التشغيل الرئيسية
    function initPlayer() {
        if (!videoId) {
            loadingMsg.textContent = "لم يتم تحديد فيديو للعرض.";
            return;
        }

        fetch(DATABASE_URL)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            // البحث عن الفيديو داخل المصفوفة
            // نستخدم '==' بدلاً من '===' لتجنب مشاكل اختلاف الأنواع (string vs number)
            const currentMovie = data.find(m => m.id == videoId);
            
            if (currentMovie) {
                displayVideo(currentMovie);
            } else {
                loadingMsg.textContent = "عذراً، هذا الفيديو غير موجود.";
            }

            // بناء القائمة السفلية
            buildMoviesList(data);
        })
        .catch(err => {
            console.error("Fetch Error:", err);
            loadingMsg.innerHTML = "تعذر تحميل بيانات الفيديو.<br>تأكد من وجود ملف ling/data/movies.json";
        });
    }

    // دالة عرض الفيديو
    function displayVideo(movie) {
        // حذف رسالة التحميل
        videoWrapper.innerHTML = ''; 

        // النصوص
        videoTitle.textContent = movie.title;
        videoDesc.textContent = movie.desc;

        // إنشاء عنصر الفيديو
        const videoEl = document.createElement('video');
        videoEl.controls = true;
        videoEl.autoplay = true;
        
        // التعامل مع صيغة .mov التي قد لا تعمل على كل المتصفحات
        // وتعيين النوع المناسب
        let mimeType = 'video/mp4';
        if (movie.url.includes('.mov')) {
            mimeType = 'video/quicktime';
        }

        videoEl.innerHTML = `
            <source src="${movie.url}" type="${mimeType}">
            <source src="${movie.url}" type="video/mp4"> متصفحك لا يدعم تشغيل هذا الفيديو.
        `;

        videoWrapper.appendChild(videoEl);
    }

    // دالة بناء القائمة السفلية
    function buildMoviesList(movies) {
        movies.forEach(movie => {
            // تخطي الفيديو المعروض حالياً
            if (movie.id == videoId) return;

            const item = document.createElement("div");
            item.className = "movie-item";
            item.innerHTML = `
                <img class="movie-bg" src="${movie.bg}" alt="${movie.title}">
                <img class="movie-logo" src="${movie.logo}" alt="${movie.title}">
            `;
            
            // عند النقر نعيد تحميل الصفحة مع الـ ID الجديد
            item.addEventListener("click", () => {
                window.location.href = `?id=${encodeURIComponent(movie.id)}`;
            });
            
            moviesList.appendChild(item);
        });
    }

    // تشغيل
    initPlayer();

  </script>
</body>
</html>
